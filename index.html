html,body{height:100%;margin:0;background:#f8fafc;}

.nav-link:hover{background:#f0fdf4;color:#16a34a;}
.nav-link.active{background:#dcfce7;color:#15803d;font-weight:700;}
.stat-card{background:#fff;border-radius:14px;border:1px solid #f1f5f9;padding:20px 22px;transition:transform .2s,box-shadow .2s;}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.08);}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;}
.badge-green{background:#dcfce7;color:#15803d;}.badge-yellow{background:#fef9c3;color:#854d0e;}
.badge-red{background:#fee2e2;color:#991b1b;}.badge-blue{background:#dbeafe;color:#1e40af;}
.badge-gray{background:#f1f5f9;color:#64748b;}.badge-purple{background:#f3e8ff;color:#7c3aed;}
.badge-orange{background:#fff7ed;color:#c2410c;}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;}
.modal-box{background:#fff;border-radius:20px;padding:28px 32px;width:100%;max-width:480px;box-shadow:0 24px 64px rgba(0,0,0,.15);animation:slideUp .22s ease;max-height:90vh;overflow-y:auto;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.page-enter{animation:fadeIn .25s ease;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl thead th{background:#f8fafc;color:#64748b;font-weight:600;text-align:left;padding:10px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #f1f5f9;}
.tbl tbody tr{border-bottom:1px solid #f8fafc;transition:background .15s;}
.tbl tbody tr:hover{background:#f8fafc;}
.tbl tbody td{padding:11px 14px;color:#374151;vertical-align:middle;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;border:none;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn-primary{background:#16a34a;color:#fff;}.btn-primary:hover:not(:disabled){background:#15803d;box-shadow:0 4px 14px rgba(22,163,74,.35);}
.btn-danger{background:#ef4444;color:#fff;}.btn-danger:hover:not(:disabled){background:#dc2626;}
.btn-outline{background:#fff;color:#374151;border:1px solid #e2e8f0;}.btn-outline:hover:not(:disabled){background:#f8fafc;}
.btn-ghost{background:transparent;color:#64748b;padding:6px 12px;}.btn-ghost:hover:not(:disabled){background:#f1f5f9;}
.btn-yellow{background:#f59e0b;color:#fff;}.btn-yellow:hover:not(:disabled){background:#d97706;}
.btn-purple{background:#7c3aed;color:#fff;}.btn-purple:hover:not(:disabled){background:#6d28d9;}
.btn-sm{padding:5px 13px;font-size:12px;border-radius:7px;}
.form-input{width:100%;border:1px solid #e2e8f0;border-radius:9px;padding:9px 13px;font-size:13.5px;color:#1e293b;outline:none;transition:border .15s,box-shadow .15s;background:#fff;}
.form-input:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12);}

.prog-bar{height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#16a34a,#22c55e);transition:width .4s ease;}
.log-item{background:#fff;border:1px solid #f1f5f9;border-radius:10px;padding:12px 14px;font-size:13px;}
#toast{position:fixed;bottom:24px;right:24px;z-index:999;transform:translateY(100px);opacity:0;transition:all .3s ease;}
#toast.show{transform:translateY(0);opacity:1;}
.toast-inner{background:#1e293b;color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;}

.section-sub{font-size:13px;color:#94a3b8;margin-bottom:20px;}

.num-green{color:#16a34a;}.num-red{color:#ef4444;}

.arsip-img {width:100%;height:140px;object-fit:cover;cursor:pointer;transition:transform 0.2s;}

// HELPERS

const fmtRp  = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');
const fmtTgl = s => { try{ return s ? new Date(s).toLocaleDateString(S.lang==='id'?'id-ID':'en-US',{day:'2-digit',month:'short',year:'numeric'}) : '-'; }catch(e){return s||'-';} };
const today  = () => new Date().toISOString().slice(0,10);
const setLoad= v => { S.loading=v; };

function sisaHari(jt) { if(!jt) return 999; const a=new Date(); a.setHours(0,0,0,0); const b=new Date(jt); b.setHours(0,0,0,0); return Math.ceil((b-a)/86400000); }
function pendBulan(b,y){ return S.pembayarans.filter(p=>p.status_validasi==='tervalidasi'&&p.tgl_bayar&&p.tgl_bayar.startsWith(`${y}-${String(b).padStart(2,'0')}`)).reduce((a,x)=>a+Number(x.jumlah||0),0); }
function penBulan(b,y){ return S.pengeluarans.filter(p=>p.tgl&&p.tgl.startsWith(`${y}-${String(b).padStart(2,'0')}`)).reduce((a,x)=>a+Number(x.jumlah||0),0); }
function avgRating(){ if(!S.reviews.length) return '0.0'; return (S.reviews.reduce((a,r)=>a+r.rating,0)/S.reviews.length).toFixed(1); }
function stars(n,sz=16){ let h='<div style="display:inline-flex;gap:2px;">'; for(let i=1;i<=5;i++) h+=`<span style="font-size:${sz}px;color:${i<=n?'#f59e0b':'#e2e8f0'};">★</span>`; return h+'</div>'; }
function toast(msg,icon='✓'){ const el=document.getElementById('toast'); document.getElementById('toast-msg').innerHTML=`<span style="font-size:16px">${icon}</span>${msg}`; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3500); }
function avatar(){ if(S.role==='penyewa'){const p=S.penyewas.find(x=>x.id===S.penyewaId); return p?p.nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase():'PW';} return {admin:'AD',pemilik:'PK'}[S.role]||'?'; }
function avaBg(){ return {admin:'#dbeafe',pemilik:'#dcfce7',penyewa:'#fef9c3'}[S.role]||'#f1f5f9'; }
function avaClr(){ return {admin:'#1e40af',pemilik:'#15803d',penyewa:'#854d0e'}[S.role]||'#374151'; }
function roleLabel(){ return t('role_'+S.role); }
function namaDisplay(){ if(S.role==='penyewa'){const p=S.penyewas.find(x=>x.id===S.penyewaId); return p?p.nama:'Penyewa';} return roleLabel(); }

// FUNGSI PENYUSUTAN (Garis Lurus per bulan)
function penyusutanBulan(b, y) {
  return S.asets.reduce((total, a) => {
    if(a.status !== 'Aktif') return total;
    const d = new Date(a.tgl_beli);
    const monthsElapsed = (y - d.getFullYear()) * 12 + (b - (d.getMonth() + 1));
    if (monthsElapsed >= 0 && monthsElapsed < a.umur_ekonomis * 12) {
      return total + (a.harga_beli / (a.umur_ekonomis * 12));
    }
    return total;
  }, 0);
}

async function login() {
  const email = document.getElementById('login-email')?.value?.trim(), pass = document.getElementById('login-pass')?.value;
  if(!email||!pass){ toast(t('email')+' & '+t('password')+'!','⚠️'); return; }
  setLoad(true); render();
  try {
    const {data,error} = await sb.auth.signInWithPassword({email,password:pass});
    if(error) throw error;
    S.userEmail = email;
    const {data:u,error:ue} = await sb.from('users').select('*').eq('email',email).single();
    if(ue||!u) throw new Error('User not found in users table.');
    S.role = u.role; S.menu = 'dashboard';
    await fetchAll();
    if(S.role==='penyewa'){ const p = S.penyewas.find(x=>x.email===email); S.penyewaId = p ? p.id : null; }
    render(); toast(`${t('success')}! ${email}`,'✓');
  } catch(e){ setLoad(false); render(); toast(t('fail')+': '+e.message,'❌'); } finally { setLoad(false); }
}

async function logout(){ await sb.auth.signOut(); Object.assign(S,{role:'guest',menu:'dashboard',penyewaId:null,userEmail:null,kamars:[],penyewas:[],pembayarans:[],pengeluarans:[],reviews:[],pengumuman:[],kerusakanLog:[],asets:[],arsip:[]}); render(); }
async function fetchAll(){ await Promise.all([fetchKamars(),fetchPenyewas(),fetchPembayarans(),fetchPengeluarans(),fetchReviews(),fetchPengumuman(),fetchKerusakan(),fetchAsets(),fetchArsip()]); }
async function fetchKamars(){ const {data}=await sb.from('kamars').select('*').order('nomor'); if(data) S.kamars=data; }
async function fetchPenyewas(){ const {data}=await sb.from('penyewas').select('*').order('nama'); if(data) S.penyewas=data; }
async function fetchPembayarans(){ const {data}=await sb.from('pembayarans').select('*, penyewas(nama, id_kamar, kamars(nomor))').order('tgl_bayar',{ascending:false}); if(data) S.pembayarans=data.map(p=>({...p, _nama:p.penyewas?.nama||'-', _kamar:p.penyewas?.kamars?.nomor||'-'})); }
async function fetchPengeluarans(){ const {data}=await sb.from('pengeluarans').select('*').order('tgl',{ascending:false}); if(data) S.pengeluarans=data; }
async function fetchReviews(){ const {data}=await sb.from('reviews').select('*').order('tgl',{ascending:false}); if(data) S.reviews=data; }
async function fetchPengumuman(){ const {data}=await sb.from('pengumuman').select('*').order('tgl',{ascending:false}); if(data) S.pengumuman=data; }
async function fetchKerusakan(){ const {data}=await sb.from('kerusakan_log').select('*').order('tgl',{ascending:false}); if(data) S.kerusakanLog=data; }
async function fetchAsets(){ const {data}=await sb.from('asets').select('*').order('tgl_beli',{ascending:false}); if(data) S.asets=data; }
async function fetchArsip(){ const {data}=await sb.from('arsip_foto').select('*').order('tgl_upload',{ascending:false}); if(data) S.arsip=data; }
async function uploadFile(file, folder){ const ext=file.name.split('.').pop(); const path=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`; const {error}=await sb.storage.from('sikost-bucket').upload(path,file,{cacheControl:'3600',upsert:false}); if(error){ console.warn('Storage error:',error.message); return null; } return sb.storage.from('sikost-bucket').getPublicUrl(path).data.publicUrl; }

// AKSI CRUD TRANSAKSI GABUNGAN (Beban & Aset)
// ============================================================
async function doSimpanTransaksi(){
  setLoad(true);
  try{
    const tipe = document.querySelector('input[name="trx-tipe"]:checked')?.value || 'beban';
    const kategori_dropdown = document.getElementById('trx-kategori')?.value;

    if (tipe === 'beban') {
      const jenis = document.getElementById('pen-jenis')?.value?.trim();
      const jumlah = parseInt(document.getElementById('pen-jumlah')?.value||'0');
      const tgl = document.getElementById('pen-tgl')?.value||today();
      if(!jenis || !jumlah) throw new Error(t('fail'));
      
      let dbKategori = 'operasional';
      if(kategori_dropdown.includes('Kebersihan')) dbKategori = 'pemeliharaan';

      const {error} = await sb.from('pengeluarans').insert([{ kategori: dbKategori, jenis: kategori_dropdown, keterangan: jenis, jumlah: jumlah, tgl: tgl }]);
      if(error) throw error;
      await fetchPengeluarans();
      toast(t('success'),'✅');
    } else {
      const nama_aset = document.getElementById('as-nama')?.value?.trim();
      const harga_beli = parseInt(document.getElementById('as-harga')?.value||'0');
      const tgl_beli = document.getElementById('as-tgl')?.value||today();
      const umur_ekonomis = parseInt(document.getElementById('as-umur')?.value||'4');
      if(!nama_aset || !harga_beli) throw new Error(t('fail'));

      const {error} = await sb.from('asets').insert([{ nama_aset: nama_aset, kategori: kategori_dropdown, harga_beli: harga_beli, tgl_beli: tgl_beli, umur_ekonomis: umur_ekonomis, metode_penyusutan: 'Garis Lurus', status: 'Aktif' }]);
      if(error) throw error;
      await fetchAsets();
      toast(t('success'),'✅');
    }
    closeModal(); render();
  }catch(e){toast('Error: '+e.message,'❌');}
  finally{setLoad(false);}
}

async function doHapusArsip(id){ if(!confirm('Hapus?')) return; try{ const {error} = await sb.from('arsip_foto').delete().eq('id', id); if(error) throw error; await fetchArsip(); render(); toast(t('success'),'🗑️'); }catch(e){toast('Error: '+e.message,'❌');} }
async function doKerusakan(){ setLoad(true); try{ const lokasi = document.getElementById('ker-lokasi')?.value?.trim(), deskripsi = document.getElementById('ker-desc')?.value?.trim(), prioritas = document.getElementById('ker-prioritas')?.value; if(!lokasi||!deskripsi) throw new Error('Error'); const {error}=await sb.from('kerusakan_log').insert([{id_penyewa:S.penyewaId,lokasi,deskripsi,prioritas,tgl:today(),status:'Dalam Proses'}]); if(error) throw error; await fetchKerusakan(); closeModal(); toast(t('success'),'🔧'); }catch(e){toast('Error: '+e.message,'❌');}finally{setLoad(false);} }
async function doSelesaiKerusakan(id){ try{ const {error}=await sb.from('kerusakan_log').update({status:'Selesai'}).eq('id',id); if(error) throw error; await fetchKerusakan(); render(); toast(t('success'),'✓'); }catch(e){toast('Error: '+e.message,'❌');} }
async function doRating(){ if(!S.rating) return; setLoad(true); try{ const komentar = document.getElementById('rating-komentar')?.value?.trim()||'-', py = S.penyewas.find(p=>p.id===S.penyewaId); const {error}=await sb.from('reviews').insert([{id_penyewa:S.penyewaId,nama:py?.nama||'Penyewa',rating:S.rating,komentar,tgl:today()}]); if(error) throw error; await fetchReviews(); S.rating=0; render(); toast(t('success'),'⭐'); }catch(e){toast('Error: '+e.message,'❌');}finally{setLoad(false);} }
async function doPengumuman(){ setLoad(true); try{ const judul=document.getElementById('ann-judul')?.value?.trim(),isi=document.getElementById('ann-isi')?.value?.trim(); if(!judul||!isi) throw new Error('Error'); const {error}=await sb.from('pengumuman').insert([{judul,isi,tgl:today(),oleh:(S.role==='admin'?'Admin':'Pemilik')}]); if(error) throw error; await fetchPengumuman(); render(); toast(t('success'),'📣'); }catch(e){toast('Error: '+e.message,'❌');}finally{setLoad(false);} }
async function doHapusAnn(id){ if(!confirm('Hapus?')) return; try{ const {error}=await sb.from('pengumuman').delete().eq('id',id); if(error) throw error; await fetchPengumuman(); render(); toast(t('success'),'🗑️'); }catch(e){toast('Error: '+e.message,'❌');} }

// ============================================================
// UI HELPERS
// ============================================================
function closeModal(){ Object.keys(S.modal).forEach(k=>S.modal[k]=false); S.selPembayaran=null; S.selKamar=null; S.selPenyewa=null; S.arsipFile=null; render(); }
function nav(k){ S.menu=k; render(); }
function setLang(l){ S.lang=l; render(); }
function openModalTransaksi(type) { S.modal.pengeluaran = true; render(); setTimeout(() => toggleTrxType(type), 50); }

function toggleTrxType(type) {
  const bBeban = document.getElementById('btn-beban'), bAset = document.getElementById('btn-aset');
  const fBeban = document.getElementById('form-beban'), fAset = document.getElementById('form-aset');
  if(type === 'beban') {
    bBeban.style.cssText = 'border:2px solid #3b82f6;background:#eff6ff;border-radius:10px;padding:12px;text-align:center;';
    bAset.style.cssText = 'border:2px solid #e2e8f0;background:#fff;border-radius:10px;padding:12px;text-align:center;';
    fBeban.style.display = 'block'; fAset.style.display = 'none';
  } else {
    bAset.style.cssText = 'border:2px solid #16a34a;background:#f0fdf4;border-radius:10px;padding:12px;text-align:center;';
    bBeban.style.cssText = 'border:2px solid #e2e8f0;background:#fff;border-radius:10px;padding:12px;text-align:center;';
    fBeban.style.display = 'none'; fAset.style.display = 'block';
  }
}

function setRating(v){ S.rating=v; render(); }
function hoverRating(v){ document.querySelectorAll('.srb').forEach((b,i)=>b.style.color=i<v?'#f59e0b':'#d1d5db'); }
function resetHover(){ document.querySelectorAll('.srb').forEach((b,i)=>b.style.color=i<S.rating?'#f59e0b':'#d1d5db'); }
function onFile(input){ const f=input.files[0]; if(!f) return; S.uploadFile=f; document.getElementById('up-ph').style.display='none'; document.getElementById('up-pv').style.display='block'; document.getElementById('up-fn').textContent=f.name; document.getElementById('up-zone').classList.add('has-file'); }
function onKTP(input){ const f=input.files[0]; if(!f) return; S.ktpFile=f; document.getElementById('ktp-ph').style.display='none'; document.getElementById('ktp-pv').style.display='block'; document.getElementById('ktp-fn').textContent=f.name; document.getElementById('ktp-zone').classList.add('has-file'); }
function onFileArsip(input){ const f=input.files[0]; if(!f) return; S.arsipFile=f; document.getElementById('up-ar-ph').style.display='none'; document.getElementById('up-ar-pv').style.display='block'; document.getElementById('up-ar-fn').textContent=f.name; }

// ============================================================
// RENDER ENGINE & ROUTER
// ============================================================
function render(){
  const app=document.getElementById('app');
  if(S.role==='guest'){ app.innerHTML=renderLogin(); return; }
  app.innerHTML=`<div style="display:flex;min-height:100vh;">${renderSidebar()}<div style="flex:1;margin-left:240px;min-height:100vh;background:#f8fafc;">${renderTopbar()}<div style="padding:28px 32px;" class="page-enter">${renderPage()}</div></div></div>${renderModals()}`;
  initCharts();
}

function renderPage(){
  const r=S.role, m=S.menu;
  if(r==='admin'){ if(m==='dashboard') return pgAdminDash(); if(m==='kamar') return pgKamar(); if(m==='penyewa') return pgPenyewa(); if(m==='validasi') return pgValidasi(); if(m==='kerusakanAdmin')return pgKerusakanAdmin(); if(m==='pengeluaran') return pgPengeluaran(); if(m==='aset') return pgAset(); if(m==='arsip') return pgArsip(); if(m==='pengumuman') return pgPengumuman(); }
  if(r==='pemilik'){ if(m==='dashboard') return pgPemilikDash(); if(m==='laporan') return pgLaporan(); }
  if(r==='penyewa'){ if(m==='dashboard') return pgPenyewaDash(); if(m==='tagihan') return pgTagihan(); if(m==='kerusakan') return pgKerusakan(); if(m==='rating') return pgRating(); }
  return `<div class="panel" style="padding:40px;text-align:center;"><p style="font-size:16px;color:#64748b;">Loading...</p></div>`;
}

function renderLogin(){ return `<div class="login-bg"><div class="login-card"><div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><div class="lang-btn"><button class="${S.lang==='id'?'active':''}" onclick="setLang('id')">ID</button><button class="${S.lang==='en'?'active':''}" onclick="setLang('en')">EN</button></div></div><div style="text-align:center;margin-bottom:28px;"><div style="width:54px;height:54px;background:#16a34a;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;">${ic.home.replace('currentColor','#fff')}</div><h1 style="font-size:24px;font-weight:800;margin:0;">${t('welcome')}</h1><p style="color:#94a3b8;font-size:13px;margin:6px 0 0;">${t('login_sub')}</p></div><div style="margin-bottom:14px;"><label class="form-label">${t('email')}</label><input class="form-input" id="login-email" placeholder="email@sikost.com" onkeydown="if(event.key==='Enter')login()"/></div><div style="margin-bottom:20px;"><label class="form-label">${t('password')}</label><input class="form-input" type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/></div><button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="login()">${S.loading?`${t('wait')}`:t('login_btn')}</button></div></div>`; }

function renderSidebar(){ 
  const menus={ 
    admin:[ {k:'dashboard',l:t('dashboard'),i:ic.dash}, {k:'kamar',l:t('kamar'),i:ic.home}, {k:'penyewa',l:t('penyewa'),i:ic.users}, {k:'validasi',l:t('validasi'),i:ic.check,b:S.pembayarans.filter(p=>p.status_validasi==='menunggu').length}, {k:'kerusakanAdmin',l:t('kerusakan'),i:ic.wrench}, {k:'pengeluaran',l:t('pengeluaran'),i:ic.money}, {k:'aset',l:t('aset'),i:ic.box}, {k:'arsip',l:t('arsip'),i:ic.image}, {k:'pengumuman',l:t('pengumuman'),i:ic.ann} ], 
    pemilik:[ {k:'dashboard',l:t('dashboard'),i:ic.dash}, {k:'laporan',l:t('laporan'),i:ic.chart} ], 
    penyewa:[ {k:'dashboard',l:t('dashboard'),i:ic.dash}, {k:'tagihan',l:t('tagihan'),i:ic.money}, {k:'kerusakan',l:t('kerusakan'),i:ic.wrench}, {k:'rating',l:t('rating'),i:ic.star} ] 
  }[S.role]||[]; 
  return `<aside class="sidebar"><div style="padding:20px 20px 16px;border-bottom:1px solid #f1f5f9;"><div style="display:flex;align-items:center;gap:10px;"><div style="width:38px;height:38px;background:#16a34a;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;">${ic.home.replace('currentColor','#fff')}</div><div style="font-weight:800;font-size:15px;color:#0f172a;">SIKOST</div></div></div><div style="padding:12px 16px;border-bottom:1px solid #f1f5f9;"><div style="background:#f0fdf4;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;"><div style="width:28px;height:28px;border-radius:50%;background:${avaBg()};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:${avaClr()};">${avatar()}</div><div style="min-width:0;"><p style="font-size:12px;font-weight:700;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${namaDisplay()}</p><p style="font-size:10.5px;color:#94a3b8;margin:0;">${roleLabel()}</p></div></div></div><nav style="flex:1;padding:12px 10px;overflow-y:auto;">${menus.map(m=>`<button class="nav-link${S.menu===m.k?' active':''}" onclick="nav('${m.k}')">${m.i}<span style="flex:1;">${m.l}</span>${m.b?`<span class="badge badge-yellow" style="font-size:10px;padding:2px 7px;">${m.b}</span>`:''}</button>`).join('')}</nav><div style="padding:12px 10px;border-top:1px solid #f1f5f9;"><button class="nav-link" onclick="logout()" style="color:#ef4444;">${ic.logout}<span>${t('logout')}</span></button></div></aside>`; 
}

function renderTopbar(){ return `<div style="background:#fff;border-bottom:1px solid #f1f5f9;padding:14px 32px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:40;"><div><h1 style="font-size:17px;font-weight:800;margin:0;">${t(S.menu)}</h1><p style="font-size:11.5px;color:#94a3b8;margin:2px 0 0;">${fmtTgl(today())}</p></div><div style="display:flex;align-items:center;gap:10px;"><div class="lang-btn"><button class="${S.lang==='id'?'active':''}" onclick="setLang('id')">ID</button><button class="${S.lang==='en'?'active':''}" onclick="setLang('en')">EN</button></div><div style="width:1px;height:24px;background:#f1f5f9;margin:0 8px;"></div><div style="display:flex;align-items:center;gap:8px;"><div style="width:32px;height:32px;border-radius:50%;background:${avaBg()};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${avaClr()};">${avatar()}</div><span style="font-size:13px;font-weight:600;color:#374151;">${namaDisplay()}</span></div></div></div>`; }

function pgAdminDash(){
  const mngg=S.pembayarans.filter(p=>p.status_validasi==='menunggu');
  const jt=S.penyewas.filter(p=>p.status==='aktif'&&sisaHari(p.jatuh_tempo)<=3);
  const kosong=S.kamars.filter(k=>k.status==='kosong').length;
  const aktif=S.penyewas.filter(p=>p.status==='aktif').length;
  const jtRows=jt.map(p=>{
    const s=sisaHari(p.jatuh_tempo), km=S.kamars.find(k=>k.id===p.id_kamar);
    return `<tr><td><b>${p.nama}</b><div style="font-size:11px;color:#94a3b8;">Kamar ${km?.nomor||'-'}</div></td><td>${fmtTgl(p.jatuh_tempo)}</td><td><span class="badge ${s<=0?'badge-red':'badge-yellow'}">${s<=0?'!':s}</span></td><td>${p.telepon||'-'}</td></tr>`;
  }).join('')||`<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:24px;">${t('no_due')}</td></tr>`;

  return `<div class="section-title">${t('ad_dash_title')}</div><div class="section-sub">${t('ad_dash_sub')}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;">${[{n:mngg.length,l:t('wait_val'),c:'#854d0e',bg:'#fef9c3',i:ic.check},{n:jt.length,l:t('due_3'),c:'#ef4444',bg:'#fee2e2',i:ic.warn},{n:aktif,l:t('act_tenant'),c:'#16a34a',bg:'#dcfce7',i:ic.users},{n:kosong,l:t('emp_room'),c:'#0ea5e9',bg:'#f0f9ff',i:ic.home}].map(x=>`<div class="stat-card"><div style="width:38px;height:38px;background:${x.bg};border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;">${x.i.replace('currentColor',x.c)}</div><div class="big-num" style="color:${x.c};">${x.n}</div><div style="font-size:12px;color:#94a3b8;margin-top:4px;">${x.l}</div></div>`).join('')}</div><div class="panel"><div class="panel-header"><div><b>${t('due_tenant_title')}</b></div><button class="btn btn-primary btn-sm" onclick="nav('validasi')">${t('see_val')}</button></div><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>${t('name')}</th><th>${t('due_date')}</th><th>${t('status')}</th><th>${t('phone')}</th></tr></thead><tbody>${jtRows}</tbody></table></div></div>`;
}

function pgKamar(){
  const cards=S.kamars.map(k=>`<div class="kamar-card ${k.status}"><div style="font-size:24px;font-weight:800;margin-bottom:4px;">${k.nomor}</div><span class="badge ${k.status==='terisi'?'badge-yellow':'badge-green'}" style="margin-bottom:10px;">${k.status==='terisi'?t('occupied'):t('empty')}</span><div style="font-size:12px;color:#64748b;margin-bottom:2px;">${k.tipe||'-'} · Lt.${k.lantai||1}</div><div style="font-size:13px;font-weight:700;color:#16a34a;margin-bottom:10px;">${fmtRp(k.harga)}<span style="font-size:10px;font-weight:400;color:#94a3b8;">/${t('month')}</span></div><div style="font-size:10.5px;color:#94a3b8;margin-bottom:14px;">${k.fasilitas||'-'}</div><div style="display:flex;gap:6px;"><button class="btn btn-outline btn-sm" style="flex:1;justify-content:center;" onclick="S.selKamar=S.kamars.find(x=>x.id==='${k.id}');S.modal.updateKamar=true;render();">${ic.edit} ${t('edit')}</button><button class="btn btn-danger btn-sm" style="padding:6px 10px;" onclick="doHapusKamar('${k.id}', '${k.status}')">${ic.trash}</button></div></div>`).join('')||`<p style="color:#94a3b8;">${t('no_km')}</p>`;
  return `<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><div class="section-title">${t('km_title')}</div><button class="btn btn-primary btn-sm" onclick="S.modal.tambahKamar=true;render()">${ic.plus} ${t('add_km')}</button></div><div class="section-sub">${t('km_sub')}</div><div class="kamar-grid">${cards}</div>`;
}

function pgPenyewa(){
  const rows=S.penyewas.map(p=>{
    const km=S.kamars.find(k=>k.id===p.id_kamar);
    return `<tr><td><div style="display:flex;gap:6px;justify-content:center;"><button class="btn btn-outline btn-sm" onclick="S.selPenyewa=S.penyewas.find(x=>x.id==='${p.id}');S.modal.editPenyewa=true;render();">${ic.edit}</button><button class="btn btn-danger btn-sm" onclick="doHapusPenyewa('${p.id}', '${p.id_kamar}')">${ic.trash}</button></div></td><td><b>${p.nama}</b><div style="font-size:11px;color:#94a3b8;">Kamar ${km?.nomor||'-'}</div></td><td>${p.telepon||'-'}</td><td>${fmtTgl(p.tgl_masuk)}</td><td>${fmtTgl(p.jatuh_tempo)}</td><td><span class="badge ${p.status==='aktif'?'badge-green':'badge-gray'}">${p.status}</span></td></tr>`;
  }).join('')||`<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px;">${t('no_py')}</td></tr>`;
  return `<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><div class="section-title">${t('py_title')}</div><button class="btn btn-primary btn-sm" onclick="S.modal.tambahPenyewa=true;S.ktpFile=null;render()">${ic.plus} ${t('add_py')}</button></div><div class="section-sub">${t('py_sub')}</div><div class="panel"><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>${t('action')}</th><th>${t('name')}</th><th>${t('phone')}</th><th>${t('in_date')}</th><th>${t('due_date')}</th><th>${t('status')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function pgValidasi(){
  const rows=S.pembayarans.map(p=>{
    const cls=p.status_validasi==='tervalidasi'?'badge-green':p.status_validasi==='menunggu'?'badge-yellow':'badge-red';
    return `<tr><td><b>${p._nama}</b></td><td style="font-weight:600;">${fmtRp(p.jumlah)}</td><td>${fmtTgl(p.tgl_bayar)}</td><td>${p.metode_bayar||'-'}</td><td><span class="badge ${cls}">${p.status_validasi}</span></td><td>${p.status_validasi==='menunggu'?`<button class="btn btn-outline btn-sm" onclick="S.selPembayaran=S.pembayarans.find(x=>x.id==='${p.id}');S.modal.validasi=true;render()">${ic.eye} ${t('check')}</button>`:''}</td></tr>`;
  }).join('')||`<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px;">${t('no_trx')}</td></tr>`;
  return `<div class="section-title">${t('val_title')}</div><div class="section-sub">${t('val_sub')}</div><div class="panel"><div class="panel-header"><b>${t('all_trx')}</b></div><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>${t('name')}</th><th>${t('amount')}</th><th>${t('date')}</th><th>${t('method')}</th><th>${t('status')}</th><th>${t('action')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function pgKerusakanAdmin(){
  const rows=S.kerusakanLog.map(l=>{
    const py=S.penyewas.find(p=>p.id===l.id_penyewa);
    return `<tr><td><b>${py?.nama||'-'}</b></td><td>${l.lokasi}</td><td>${l.deskripsi}</td><td><span class="badge badge-gray">${l.prioritas}</span></td><td><span class="badge ${l.status==='Selesai'?'badge-green':'badge-yellow'}">${l.status}</span></td><td>${fmtTgl(l.tgl)}</td><td>${l.status!=='Selesai'?`<button class="btn btn-primary btn-sm" onclick="doSelesaiKerusakan('${l.id}')">✓ ${t('done')}</button>`:'-'}</td></tr>`;
  }).join('')||`<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:24px;">${t('no_kr')}</td></tr>`;
  return `<div class="section-title">${t('kr_title')}</div><div class="section-sub">${t('kr_sub')}</div><div class="panel"><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>${t('name')}</th><th>${t('loc')}</th><th>${t('desc')}</th><th>${t('prio')}</th><th>${t('status')}</th><th>${t('date')}</th><th>${t('action')}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function pgPengeluaran(){
  const penRows=S.pengeluarans.map(e=>`<tr><td><span class="badge badge-gray">${e.jenis||'-'}</span></td><td>${e.keterangan||'-'}</td><td style="color:#ef4444;font-weight:600;">${fmtRp(e.jumlah)}</td><td>${fmtTgl(e.tgl)}</td><td><button class="btn btn-ghost btn-sm" style="color:#ef4444;" onclick="doHapusPengeluaran('${e.id}')">${ic.trash}</button></td></tr>`).join('')||`<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px;">${t('no_exp')}</td></tr>`;
  return `<div style="display:flex;justify-content:space-between;margin-bottom:10px;"><div class="section-title">${t('pengeluaran')}</div><button class="btn btn-primary btn-sm" onclick="openModalTransaksi('beban')">${ic.plus} ${t('add_trx_out')}</button></div><div class="panel"><table class="tbl"><thead><tr><th>${t('type')}</th><th>${t('desc')}</th><th>${t('amount')}</th><th>${t('date')}</th><th>${t('action')}</th></tr></thead><tbody>${penRows}</tbody></table></div>`;
}

function pgAset(){

function pgLaporan(){
  const months=[{b:1,n:1},{b:2,n:2},{b:3,n:3},{b:4,n:4},{b:5,n:5},{b:6,n:6},{b:7,n:7},{b:8,n:8},{b:9,n:9},{b:10,n:10},{b:11,n:11},{b:12,n:12}];
  const y=new Date().getFullYear();
  let tP=0, tOp=0, tMn=0;
  
  const rows=months.map(m=>{
    const p = pendBulan(m.b, y), op = penBulan(m.b, y), penyusutan = penyusutanBulan(m.b, y);
    const totalBeban = op + penyusutan, lr = p - totalBeban;
    tP+=p; tOp+=op; tMn+=penyusutan;
    return `<tr><td style="font-weight:600;">${m.b}/${y}</td><td style="color:#16a34a;font-weight:600;">${fmtRp(p)}</td><td style="color:#1d4ed8;">${fmtRp(op)}</td><td style="color:#f59e0b;">${fmtRp(penyusutan)}</td><td style="color:#ef4444;font-weight:600;">${fmtRp(totalBeban)}</td><td class="${lr>=0?'num-green':'num-red'}" style="font-weight:700;">${lr>=0?'+':''}${fmtRp(lr)}</td></tr>`;
  }).join('');
  
  const accBeban = {};
  S.pengeluarans.filter(e => e.tgl && e.tgl.startsWith(y.toString())).forEach(e => { const j = e.jenis || 'Lain-lain'; if(!accBeban[j]) accBeban[j] = 0; accBeban[j] += Number(e.jumlah); });
  const accPenyusutan = {};
  for (let bulan = 1; bulan <= 12; bulan++) { S.asets.forEach(a => { if(a.status !== 'Aktif') return; const d = new Date(a.tgl_beli); const mElapsed = (y - d.getFullYear()) * 12 + (bulan - (d.getMonth() + 1)); if (mElapsed >= 0 && mElapsed < a.umur_ekonomis * 12) { if(!accPenyusutan['Penyusutan ' + a.nama_aset]) accPenyusutan['Penyusutan ' + a.nama_aset] = 0; accPenyusutan['Penyusutan ' + a.nama_aset] += (a.harga_beli / (a.umur_ekonomis * 12)); } }); }

  let rincianHtml = `<table class="tbl"><thead><tr><th>${t('acc_det')}</th><th style="text-align:right;">${t('total')} (${y})</th></tr></thead><tbody>`;
  for(let k in accBeban) rincianHtml += `<tr><td>${k}</td><td style="text-align:right;font-weight:600;color:#ef4444;">${fmtRp(accBeban[k])}</td></tr>`;
  for(let k in accPenyusutan) rincianHtml += `<tr><td>${k}</td><td style="text-align:right;font-weight:600;color:#f59e0b;">${fmtRp(accPenyusutan[k])}</td></tr>`;
  if (Object.keys(accBeban).length === 0 && Object.keys(accPenyusutan).length === 0) rincianHtml += `<tr><td colspan="2" style="text-align:center;color:#94a3b8;padding:20px;">-</td></tr>`;
  rincianHtml += `</tbody></table>`;

  const penRows=S.pengeluarans.map(e=>`<tr><td><span class="badge badge-gray">${e.jenis||'-'}</span></td><td>${e.keterangan||'-'}</td><td style="color:#ef4444;font-weight:600;">${fmtRp(e.jumlah)}</td><td>${fmtTgl(e.tgl)}</td></tr>`).join('')||`<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px;">${t('no_exp')}</td></tr>`;

  return `<div class="section-title">${t('lap_title')} ${y}</div><div class="section-sub">${t('lap_sub')}</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;">${[{l:t('tot_inc'),c:'#16a34a',v:fmtRp(tP)},{l:t('op_exp'),c:'#1d4ed8',v:fmtRp(tOp)},{l:t('dep_exp'),c:'#f59e0b',v:fmtRp(tMn)},{l:t('tot_exp'),c:'#ef4444',v:fmtRp(tOp+tMn)},{l:t('net_inc'),c:(tP-(tOp+tMn))>=0?'#16a34a':'#ef4444',v:fmtRp(tP-(tOp+tMn))}].map(x=>`<div class="stat-card"><div style="font-size:11px;color:#94a3b8;margin-bottom:4px;">${x.l}</div><div class="big-num" style="font-size:16px;color:${x.c};">${x.v}</div></div>`).join('')}</div><div style="display:grid;grid-template-columns:3fr 2fr; gap:20px; margin-bottom:20px;"><div class="panel"><div class="panel-header"><b>${t('month_lap')}</b></div><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>${t('month')}</th><th>${t('lbl_inc')}</th><th style="color:#1d4ed8;">${t('op_exp')}</th><th style="color:#f59e0b;">${t('dep_exp')}</th><th>${t('tot_exp')}</th><th>${t('net_inc')}</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="panel"><div class="panel-header"><b>${t('acc_det')}</b></div><div style="overflow-x:auto;">${rincianHtml}</div></div></div><div class="panel"><div class="panel-header"><b>${t('trx_hist')}</b></div><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>${t('type')}</th><th>${t('desc')}</th><th>${t('amount')}</th><th>${t('date')}</th></tr></thead><tbody>${penRows}</tbody></table></div></div>`;
}

  if(S.modal.tambahKamar){ h+=`<div class="modal-overlay" onclick="closeModal()"><div class="modal-box" onclick="event.stopPropagation()"><h2 style="font-size:16px;font-weight:800;margin-bottom:16px;">${t('add_km')}</h2><div style="margin-bottom:14px;"><label class="form-label">${t('f_kamar')} *</label><input class="form-input" id="nk-nomor"/></div><div style="margin-bottom:14px;"><label class="form-label">${t('f_harga')} *</label><input class="form-input" type="number" id="nk-harga"/></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><button class="btn btn-outline" style="justify-content:center;" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" style="justify-content:center;" onclick="doTambahKamar()">${t('add')}</button></div></div></div>`; }

    const kamarKosong=S.kamars.filter(k=>k.status==='kosong');
    h+=`<div class="modal-overlay" onclick="closeModal()"><div class="modal-box" style="max-width:520px;" onclick="event.stopPropagation()"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;"><h2 style="font-size:16px;font-weight:800;color:#0f172a;margin:0;">${t('add_py')}</h2><button onclick="closeModal()" class="btn btn-ghost" style="padding:6px;">${ic.x}</button></div><div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#166534;">${t('auto_auth')}</div><div style="margin-bottom:12px;"><label class="form-label">${t('f_fullname')} *</label><input class="form-input" id="tp-nama"/></div><div style="margin-bottom:12px;"><label class="form-label">${t('email')} *</label><input class="form-input" type="email" id="tp-email"/></div><div style="margin-bottom:12px;"><label class="form-label">${t('f_pass_init')} *</label><input class="form-input" type="text" id="tp-pass"/></div><div style="margin-bottom:12px;"><label class="form-label">${t('phone')}</label><input class="form-input" type="tel" id="tp-telepon"/></div><div style="margin-bottom:12px;"><label class="form-label">Kamar *</label><select class="form-input form-select" id="tp-kamar">${kamarKosong.length>0?kamarKosong.map(k=>`<option value="${k.id}">${k.nomor} — ${fmtRp(k.harga)}/bln</option>`).join(''):`<option disabled>${t('emp_room')} 0</option>`}</select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;"><div><label class="form-label">${t('in_date')} *</label><input class="form-input" type="date" id="tp-masuk" value="${today()}"/></div><div><label class="form-label">${t('due_date')} *</label><input class="form-input" type="date" id="tp-jatuh"/></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;"><button class="btn btn-outline" style="justify-content:center;" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" style="justify-content:center;" onclick="doTambahPenyewa()">${t('save')}</button></div></div></div>`;
  }

  if(S.modal.editPenyewa && S.selPenyewa){ const p=S.selPenyewa; h+=`<div class="modal-overlay" onclick="closeModal()"><div class="modal-box" onclick="event.stopPropagation()"><h2 style="font-size:16px;font-weight:800;margin-bottom:16px;">${t('edit')} Penyewa</h2><div style="margin-bottom:14px;"><label class="form-label">${t('f_fullname')}</label><input class="form-input" id="ep-nama" value="${p.nama}"/></div><div style="margin-bottom:14px;"><label class="form-label">${t('phone')}</label><input class="form-input" id="ep-telepon" value="${p.telepon||''}"/></div><div style="margin-bottom:14px;"><label class="form-label">${t('due_date')}</label><input class="form-input" type="date" id="ep-jatuh" value="${p.jatuh_tempo||''}"/></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;"><button class="btn btn-outline" style="justify-content:center;" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" style="justify-content:center;" onclick="doEditPenyewa()">${t('save')}</button></div></div></div>`; }

// ============================================================
// CHARTS
// ============================================================
let charts={};
function destroyChart(id){ if(charts[id]){charts[id].destroy();delete charts[id];} }

function initCharts(){
  const barEl=document.getElementById('barChart');
  if(barEl){
    destroyChart('bar');
    const now=new Date(); const lbls=[],pd=[],pe=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      lbls.push(['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()]);
      pd.push(pendBulan(d.getMonth()+1,d.getFullYear()));
      pe.push(penBulan(d.getMonth()+1,d.getFullYear()) + penyusutanBulan(d.getMonth()+1,d.getFullYear()));
    }
    charts['bar']=new Chart(barEl,{ type:'bar',data:{labels:lbls,datasets:[{label:t('lbl_inc'),data:pd,backgroundColor:'rgba(22,163,74,.85)',borderRadius:6},{label:t('lbl_exp'),data:pe,backgroundColor:'rgba(239,68,68,.7)',borderRadius:6}]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:10,usePointStyle:true}},tooltip:{callbacks:{label:c=>' '+fmtRp(c.raw)}}},scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:11},callback:v=>'Rp '+(v/1000000).toFixed(1)+'jt'}}}} });
  }
  const donutEl=document.getElementById('donutChart');
  if(donutEl){
    destroyChart('donut');
    const terisi=S.kamars.filter(k=>k.status==='terisi').length;
    const kosong=S.kamars.filter(k=>k.status==='kosong').length;
    charts['donut']=new Chart(donutEl,{
      type:'doughnut',data:{labels:[t('lbl_terisi'),t('lbl_kosong')],datasets:[{data:[terisi,kosong],backgroundColor:['#16a34a','#e2e8f0'],borderWidth:0}]},
      options:{cutout:'74%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.label+': '+c.raw}}}},
      plugins:[{id:'ctr',beforeDraw(c){const{width:w,height:h,ctx}=c;ctx.save();ctx.font='800 22px Plus Jakarta Sans';ctx.fillStyle='#0f172a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((terisi+kosong>0?Math.round(terisi/(terisi+kosong)*100):0)+'%',w/2,h/2-6);ctx.font='500 11px Plus Jakarta Sans';ctx.fillStyle='#94a3b8';ctx.fillText(t('lbl_terisi'),w/2,h/2+14);ctx.restore();}}]
    });
  }
}

window.doUploadArsip=doUploadArsip; window.doKerusakan=doKerusakan; window.doSelesaiKerusakan=doSelesaiKerusakan;
window.openModalTransaksi=openModalTransaksi; window.toggleTrxType=toggleTrxType;
window.onFile=onFile; window.onKTP=onKTP; window.onFileArsip=onFileArsip; window.setRating=setRating; window.hoverRating=hoverRating; window.resetHover=resetHover; window.doRating=doRating;
render();
